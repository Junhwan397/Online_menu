<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}QR 메뉴 관리 시스템{% endblock %}</title>
    <!-- 디자인은 나중에 추가할 예정입니다. -->
</head>
<body>
    <header>
        <h1>QR 메뉴 관리 시스템</h1>
        <nav>
            <ul>
                <li><a href="{{ url_for('main.home_page') }}">홈</a></li>

                <!-- 현재 사용자의 로그인 상태(current_user.is_authenticated)에 따라 링크를 변경합니다. -->
                {% if current_user.is_authenticated %}
                    <li><a href="{{ url_for('main.restaurant_list_page') }}">식당 관리</a></li>
                    <!-- 로그인된 사용자의 이름과 로그아웃 링크를 표시합니다. -->
                    <li><a href="{{ url_for('main.logout_page') }}">로그아웃 ({{ current_user.username }})</a></li>
                {% else %}
                    <!-- 로그인되지 않은 경우, 로그인 및 회원가입 링크를 표시합니다. -->
                    <li><a href="{{ url_for('main.login_page') }}">로그인</a></li>
                    <li><a href="{{ url_for('main.register_page') }}">회원가입</a></li>
                {% endif %}
            </ul>
        </nav>
    </header>

    <main>
        <!-- 실제 페이지 콘텐츠가 삽입될 위치 -->
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>&copy; 2025 QR Menu</p>
    </footer>
</body>
</html>
